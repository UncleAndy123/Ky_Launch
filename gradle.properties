# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Defense in depth: never let Gradle auto-download a JDK toolchain over the
# network, even if one gets declared later (by this build or a dependency) -
# only ever use a JDK it can already find locally. Keeps the build usable
# behind proxies/VPNs that break TLS to api.foojay.io.
org.gradle.java.installations.auto-download=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
